name: mlops-hw2

x-app: &app
  image: mlops-hw2-app:local
  build: .
  init: true
  environment:
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    KAFKA_TOPIC: transactions
    CLICKHOUSE_URL: http://clickhouse:8123
    CLICKHOUSE_USER: homework
    CLICKHOUSE_PASSWORD: homework
  volumes:
    - ./data:/data:ro
    - ./results:/results

services:
  kafka:
    image: apache/kafka:3.9.1
    user: "0:0"
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 5s
      timeout: 10s
      start_period: 30s
      retries: 20

  kafka-init:
    image: apache/kafka:3.9.1
    entrypoint: ["/opt/kafka/bin/kafka-topics.sh"]
    command: ["--bootstrap-server", "kafka:9092", "--create", "--if-not-exists", "--topic", "transactions", "--partitions", "3", "--replication-factor", "1", "--config", "retention.ms=-1"]
    depends_on:
      kafka:
        condition: service_healthy

  clickhouse:
    image: clickhouse/clickhouse-server:25.8.4.13
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: homework
      CLICKHOUSE_PASSWORD: homework
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:${CLICKHOUSE_HTTP_PORT:-8123}:8123"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./config/clickhouse.xml:/etc/clickhouse-server/config.d/homework.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "homework", "--password", "homework", "--query", "SELECT 1"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 20

  clickhouse-init:
    image: clickhouse/clickhouse-server:25.8.4.13
    entrypoint: ["/bin/sh", "-ec"]
    command: ["clickhouse-client --host clickhouse --user homework --password homework --multiquery < /sql/01_schema.sql"]
    volumes:
      - ./sql:/sql:ro
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy

  producer:
    <<: *app
    profiles: ["tools"]
    command: ["python", "-m", "scripts.publish_csv", "/data/train.csv", "/data/test.csv"]
    depends_on:
      clickhouse-init:
        condition: service_completed_successfully

  verify:
    <<: *app
    profiles: ["tools"]
    command: ["python", "-m", "scripts.verify"]
    depends_on:
      clickhouse-init:
        condition: service_completed_successfully

  benchmark:
    <<: *app
    profiles: ["tools"]
    command: ["python", "-m", "scripts.benchmark"]
    depends_on:
      clickhouse-init:
        condition: service_completed_successfully

volumes:
  kafka-data:
  clickhouse-data:
