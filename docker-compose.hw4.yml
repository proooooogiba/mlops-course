name: mlops-hw4
services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.8.4.13
    environment:
      CLICKHOUSE_USER: homework
      CLICKHOUSE_PASSWORD: homework
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
    ports:
      - '127.0.0.1:18123:8123'
    volumes:
      - hw4-clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: [CMD, clickhouse-client, --user, homework, --password, homework, --query, SELECT 1]
      interval: 5s
      timeout: 5s
      retries: 30
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
  dbt:
    build: ./dbt
    profiles: [tools]
    working_dir: /usr/app/dbt
    environment:
      DBT_CH_HOST: clickhouse
      DBT_RAW_DATABASE: transactions_db
    volumes:
      - ./dbt:/usr/app/dbt
      - ./data:/data:ro
    ports:
      - '127.0.0.1:8082:8082'
    depends_on:
      clickhouse:
        condition: service_healthy
volumes:
  hw4-clickhouse-data:
