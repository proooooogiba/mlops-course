name: Kafka to ClickHouse
on:
  push:
    branches: [hw2]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: make test PYTHON=python
      - name: Prepare synthetic data (Kaggle data is not redistributed)
        run: python -m tests.make_demo
      - run: docker compose config --quiet
      - run: make up
      - run: make load verify benchmark
      - name: Check deterministic winners independently of the verifier
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          with Path('results/runtime/max_transaction_by_state.csv').open() as f:
              assert list(csv.DictReader(f)) == [
                  {'us_state': 'CA', 'cat_id': 'travel', 'max_amount': '100.00'},
                  {'us_state': 'NY', 'cat_id': 'kids_pets', 'max_amount': '123.45'},
                  {'us_state': 'TX', 'cat_id': 'grocery_pos', 'max_amount': '0.20'},
              ]
          PY
      - if: failure()
        run: make logs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-results
          path: results/runtime/
      - if: always()
        run: docker compose down -v
