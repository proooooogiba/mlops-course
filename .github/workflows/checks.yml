name: HW5 monitoring and fraud scoring
on:
  push:
    branches: [hw5]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: make test PYTHON=python
      - run: python -m tests.make_monitoring_demo
      - name: Match shared-directory ownership to the runner
        run: |
          echo "AIRFLOW_UID=$(id -u)" > .env
          echo "GRAFANA_DB_PASSWORD=$(openssl rand -hex 16)" >> .env
      - run: docker compose config --quiet
      - run: make up
      - name: Reinitialize existing Kafka topics safely
        run: docker compose run --rm kafka-init
      - name: Parse actual DAGs with Airflow
        run: |
          docker compose exec -T airflow-scheduler python -c "from airflow.models import DagBag; b=DagBag('/opt/airflow/dags'); assert not b.import_errors, b.import_errors; assert len(b.dags)==3, b.dags"
      - name: Exercise actual scheduler, manual DAG runs and Kafka scoring
        run: |
          scorer_before=$(docker compose ps -q scorer)
          python -m scripts.verify_hw5 --reload
          test "$scorer_before" = "$(docker compose ps -q scorer)"
          test "$(docker inspect --format '{{.RestartCount}}' "$scorer_before")" = "0"
      - if: failure()
        run: docker compose logs --tail=150
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hw5-evidence
          path: |
            runtime/hw5/verification.json
            runtime/hw5/models/latest.json
            runtime/hw5/reports/
      - if: always()
        run: docker compose down -v
